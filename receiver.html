<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Recept – Cast-mottagare</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #3D1210; overflow: hidden; }
  iframe { border: none; width: 100%; height: 100%; display: block; }
  iframe[hidden] { display: none; }
  #idle {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px; color: #FFEFE8; font-family: -apple-system, sans-serif;
  }
  #idle .emoji { font-size: 4rem; }
  /* Utan denna regel vinner "display: flex" ovan över webbläsarens inbyggda
     [hidden]-regel, så idle.hidden = true i skriptet nedan gömde aldrig
     tomaten visuellt — den låg kvar ovanpå det inladdade receptet. */
  #idle[hidden] { display: none; }
</style>
</head>
<body>
  <!-- Väntar på ett cast-meddelande med { hash: "laga/<recept-id>" } från sändaren.
       Laddar då om samma app (index.html) i en iframe med det hashet, vilket
       återanvänder hela laga-läget (auto-fit text, två spalter) rakt av. -->
  <div id="idle"><div class="emoji">🍅</div><div>Väntar på recept …</div></div>
  <iframe id="frame" src="about:blank" hidden></iframe>

  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    var NAMESPACE = 'urn:x-cast:com.receptrosso.cast';
    var frame = document.getElementById('frame');
    var idle = document.getElementById('idle');

    var context = cast.framework.CastReceiverContext.getInstance();
    context.addCustomMessageListener(NAMESPACE, function (event) {
      var data = event.data || {};
      if (data.hash) {
        idle.hidden = true;
        frame.hidden = false;
        // Sätter samma src igen är ofarligt (ingen omladdning om värdet
        // redan är detsamma) — sändaren skickar om meddelandet ett par
        // gånger tills den här bekräftelsen kommer fram.
        frame.src = 'index.html#' + data.hash;
        if (event.senderId) {
          context.sendCustomMessage(NAMESPACE, event.senderId, { ack: data.hash });
        }
      }
    });
    // Vår mottagare spelar aldrig upp media – den visar bara ett recept. CAF:s
    // standardbeteende är att stänga en "idle" mottagare (ingen media/aktivitet)
    // efter en stund, vilket gjorde att casten dog mitt under matlagningen: när
    // telefonen gick i viloläge kopplade sändaren ifrån (standard efter ~10 s),
    // och med 0 sändare + ingen media stängde mottagaren sig själv. Nest Hub föll
    // då tillbaka till sin startskärm och man fick casta om. disableIdleTimeout
    // håller mottagaren igång tills castningen aktivt avslutas – Google
    // rekommenderar uttryckligen flaggan för icke-media-appar.
    var options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = true;
    context.start(options);
</script>
</body>
</html>
